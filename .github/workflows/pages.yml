name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifact_id="$({
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")][0].id'
          })"
          if [[ -z "$artifact_id" || "$artifact_id" == "null" ]]; then
            echo "Unable to find the github-pages artifact for this run." >&2
            exit 1
          fi

          oidc_token="$({
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value'
          })"
          if [[ -z "$oidc_token" || "$oidc_token" == "null" ]]; then
            echo "Unable to obtain the GitHub Actions OIDC token." >&2
            exit 1
          fi

          build_version="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload="$({
            jq -n \
              --argjson artifact_id "$artifact_id" \
              --arg pages_build_version "$build_version" \
              --arg oidc_token "$oidc_token" \
              '{artifact_id: $artifact_id, pages_build_version: $pages_build_version, oidc_token: $oidc_token}'
          })"
          response="$({
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/pages/deployments" \
              --input - <<<"$payload"
          })"

          deployment_id="$(jq -r '.id // (.status_url | rtrimstr("/") | split("/")[-1])' <<<"$response")"
          page_url="$(jq -r '.page_url // empty' <<<"$response")"
          if [[ -z "$deployment_id" || "$deployment_id" == "null" ]]; then
            echo "GitHub did not return a Pages deployment ID." >&2
            exit 1
          fi
          echo "page_url=$page_url" >>"$GITHUB_OUTPUT"
          echo "Created Pages deployment $deployment_id."

          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            status="$({
              gh api \
                "repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}" \
                --jq '.status'
            })"
            echo "Pages deployment status: $status"
            case "$status" in
              succeed)
                exit 0
                ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "Pages deployment ended with status: $status" >&2
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "Pages deployment did not finish within 30 minutes; leaving it intact for GitHub to complete." >&2
          exit 1
